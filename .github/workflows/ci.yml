name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Build, test and stage the release candidate
        run: |
          scripts/validate-public-content
          python3 -B -m unittest discover -s Tests/ReleaseTools
          scripts/package-release --jobs 2
          scripts/verify-release --run-tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-cli-macos-arm64-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/releases/*
          if-no-files-found: error
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/release-validation
          if-no-files-found: ignore
  demo:
    needs: package
    uses: computer-mcp/github-workflows/.github/workflows/terminal-demo.yml@36a8e11e46fc8831397cebab54cd4657dcac7898
    with:
      artifact: apple-cli-macos-arm64-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      archive: apple-cli-*-macos-arm64.tar.gz
      executable: apple-cli-*-macos-arm64/bin/apple
      runner: xcode-27
  validate:
    if: always()
    needs: [package, demo]
    uses: computer-mcp/github-workflows/.github/workflows/result.yml@36a8e11e46fc8831397cebab54cd4657dcac7898
    with:
      needs-json: ${{ toJSON(needs) }}
