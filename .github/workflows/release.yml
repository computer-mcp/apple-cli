name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CANDIDATE_ARTIFACT: apple-cli-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
          key: dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Build and accept the tagged archive
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          Scripts/validate-public-content
          python3 -B -m unittest discover -s Tests/ReleaseTools
          Scripts/package-release --tag "$RELEASE_TAG" --jobs 2
          Scripts/verify-release --tag "$RELEASE_TAG" --run-tests --github-output
          printf 'artifact_name=%s\n' "$CANDIDATE_ARTIFACT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: .build/releases/*
          if-no-files-found: error
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/release-validation
          if-no-files-found: ignore

  publish:
    if: github.repository == 'computer-mcp/apple-cli'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: .build/releases
      - name: Publish the accepted files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: .github/scripts/publish-release
