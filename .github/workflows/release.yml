name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, validate and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CANDIDATE_ARTIFACT: apple-cli-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build and accept the tagged archive
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          scripts/validate-public-content
          python3 -B -m unittest discover -s Tests/ReleaseTools
          scripts/package-release --tag "$RELEASE_TAG" --jobs 2
          scripts/verify-release --tag "$RELEASE_TAG" --run-tests --github-output
          printf 'artifact_name=%s\n' "$CANDIDATE_ARTIFACT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: .build/releases/*
          if-no-files-found: error
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/release-validation
          if-no-files-found: ignore

  publish:
    if: github.repository == 'computer-mcp/apple-cli'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: .build/releases
      - name: Publish the accepted files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: scripts/publish-release
