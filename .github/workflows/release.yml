name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing version tag to validate and package
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the tagged source and package it
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        run: |
          Scripts/validate-public-content
          Scripts/package-release --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-cli-macos-arm64-release-candidate
          path: .build/releases/*
          if-no-files-found: error
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-logs
          path: .build/release-validation
          if-no-files-found: ignore
