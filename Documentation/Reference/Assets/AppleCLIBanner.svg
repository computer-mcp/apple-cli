<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title description">
  <title id="title">apple-cli</title>
  <desc id="description">Apple apps, from your terminal. A local command line tool and MCP server for macOS, with Notes, Reminders and agent connection examples.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ded8ce" stroke-width="1" opacity=".38"/>
    </pattern>
  </defs>
  <rect width="1440" height="420" rx="24" fill="#f5f1e9"/>
  <rect x="738" width="702" height="420" rx="24" fill="url(#grid)"/>
  <path d="M48 42h36" stroke="#c65332" stroke-width="4"/>
  <text x="100" y="47" fill="#6b6258" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="2.4">COMPUTER MCP</text>

  <rect x="48" y="94" width="66" height="66" rx="17" fill="#20211f"/>
  <path d="m66 113 13 14-13 14m24 0h11" fill="none" stroke="#f5f1e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="153" fill="#20211f" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="82" font-weight="650" letter-spacing="-4">apple-cli</text>
  <text x="48" y="222" fill="#20211f" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="32" letter-spacing="-.6">Apple apps, from your terminal.</text>
  <text x="48" y="267" fill="#6b6258" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="21">One command. Local workflows. Agent ready.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1">
    <rect x="48" y="320" width="142" height="42" rx="21" fill="#e8e1d6"/>
    <text x="73" y="347" fill="#514b43">CLI + MCP</text>
    <rect x="200" y="320" width="149" height="42" rx="21" fill="#e8e1d6"/>
    <text x="222" y="347" fill="#514b43">19 TARGETS</text>
    <rect x="359" y="320" width="113" height="42" rx="21" fill="#e8e1d6"/>
    <text x="383" y="347" fill="#514b43">macOS</text>
  </g>

  <rect x="744" y="84" width="648" height="278" rx="18" fill="#cfc7bc" opacity=".6"/>
  <rect x="738" y="76" width="648" height="278" rx="18" fill="#20211f"/>
  <path d="M738 126h648" stroke="#3d3d39" stroke-width="1"/>
  <circle cx="764" cy="102" r="5" fill="#c65332"/>
  <circle cx="783" cy="102" r="5" fill="#b99961"/>
  <circle cx="802" cy="102" r="5" fill="#7f8b71"/>
  <text x="1062" y="108" text-anchor="middle" fill="#aaa89d" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" letter-spacing=".8">apple</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="764" y="171" fill="#f0eee7"><tspan fill="#e38863">$ </tspan>apple notes search --query "Plan" --json</text>
    <text x="764" y="218" fill="#f0eee7"><tspan fill="#e38863">$ </tspan>apple reminders lists list --json</text>
    <text x="764" y="265" fill="#f0eee7"><tspan fill="#e38863">$ </tspan>apple-cli-mcp stdio</text>
    <text x="764" y="312" fill="#e38863">$</text>
